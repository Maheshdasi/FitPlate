services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+psycopg2://fitness:fitness@db:5432/fitness_db
      TEST_DATABASE_URL: postgresql+psycopg2://fitness:fitness@db:5432/fitness_test
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
