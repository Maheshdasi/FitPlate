# Python linting (run with: ruff check .)
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "**/venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends(...) in default arguments is the intended pattern

[lint.isort]
known-first-party = ["app", "ml"]
