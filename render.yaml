# Render Blueprint: deploys FitPlate from this GitHub repository.
# Click the "Deploy to Render" button in README.md, or create a Blueprint in the Render dashboard.
services:
  - type: web
    name: fitplate
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitplate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Optional AI assistant keys: paste one in the Render dashboard (Environment tab)
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: fitplate-db
    plan: free
    databaseName: fitness_db
    user: fitness
