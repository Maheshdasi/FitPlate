name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (FastAPI + PostgreSQL + ML)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://fitness:fitness@localhost:5432/fitness_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install packages
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests with coverage
        working-directory: backend
        run: pytest -v --cov=app --cov=../ml --cov-report=term
      - name: Evaluate the ML models
        run: python -m ml.evaluate

  frontend:
    name: Frontend build (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
